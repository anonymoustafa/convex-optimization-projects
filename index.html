    :root {

    * { box-sizing: border-box; }

    body {

      margin-bottom: 1.25rem;
      font-size: 0.9rem;
    }

    .breadcrumb a {
      color: var(--muted);
      text-decoration: none;
    }

    .breadcrumb a:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .breadcrumb .author-link {
      color: var(--accent);
      font-weight: 600;
    }

    h1 {
      margin: 0 0 0.4rem 0;
      font-size: 1.75rem;
    }

    .subtitle {
      margin: 0 0 1.75rem 0;
      color: var(--muted);
    }

    ul.problem-list {
      list-style: disc;
      padding-left: 1.5rem;
      margin: 0;
    }

    ul.problem-list li {
      margin-bottom: 0.85rem;
      font-size: 1.08rem;
    }

    ul.problem-list a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    ul.problem-list a:hover {
      text-decoration: underline;
    }
